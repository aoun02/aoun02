  <text x="40" y="204" class="o" style="animation-delay:2.55s"><tspan class="k">frontend </tspan><tspan class="dim">→ </tspan><tspan class="out">React · Flutter (iOS &amp; Android)</tspan></text>
  <text x="40" y="228" class="o" style="animation-delay:2.7s"><tspan class="k">cloud    </tspan><tspan class="dim">→ </tspan><tspan class="out">Docker · Helm · Azure Kubernetes · CI/CD · Grafana</tspan></text>

