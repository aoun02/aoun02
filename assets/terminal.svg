  </defs>
  <style>
    text { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; font-size: 16px; }
    .p { fill: #4ade80; } .cmd { fill: #ffffff; } .out { fill: #cfe3ec; } .k { fill: #4FC3F7; } .dim { fill: #7c98a6; }
    .o { opacity: 0; animation: show 0.4s ease forwards; }
    @keyframes show { to { opacity: 1; } }
    .cur { opacity: 0; animation: show 0s 5.4s forwards, blink 1s steps(1) 5.4s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="410" rx="14" fill="#0b1a20"/>
