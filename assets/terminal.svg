<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410">
  <defs>
    <clipPath id="c1"><rect x="40" y="70" height="30" width="0"><animate attributeName="width" from="0" to="300" begin="0.3s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="134" height="30" width="0"><animate attributeName="width" from="0" to="300" begin="1.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
